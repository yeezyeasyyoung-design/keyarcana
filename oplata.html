<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Оплата заказа · KeyArcana</title>
    <meta name="theme-color" content="#06040a">
    <style>
        body {
            background: #06040a;
            font-family: 'Jost', sans-serif;
            color: #ede4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .payment-container {
            background: rgba(24, 14, 40, 0.9);
            border: 1px solid #c9a03e;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 45px rgba(201, 160, 62, 0.2);
            margin: 20px auto;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #ffd966;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .service-info {
            background: rgba(14, 8, 28, 0.8);
            border: 1px solid #54337a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .service-info p {
            margin: 8px 0;
            font-size: 1rem;
            color: #cfc0e8;
        }
        .service-info strong {
            color: #ffd966;
        }
        .total-amount {
            font-size: 2rem;
            color: #ffd966;
            font-weight: 700;
            margin: 15px 0;
            text-shadow: 0 0 10px #ffd700;
        }
        #payment-form {
            margin-top: 20px;
        }
        .error-message {
            color: #ff6b6b;
            margin-top: 15px;
            display: none;
            padding: 12px;
            background: rgba(255,0,0,0.1);
            border-radius: 8px;
        }
        .success-message {
            color: #51cf66;
            margin-top: 15px;
            display: none;
            padding: 12px;
            background: rgba(81,207,102,0.1);
            border-radius: 8px;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #dac0ff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .back-link:hover {
            color: #ffd966;
            text-shadow: 0 0 8px #ffd966;
        }
        @media (max-width: 600px) {
            .payment-container {
                padding: 25px 18px;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>🔮 Оплата заказа</h1>
        
        <div class="service-info">
            <p><strong>Услуга:</strong> <span id="service-name">Расклад Таро</span></p>
            <p><strong>Описание:</strong> <span id="service-desc">Стандартный расклад</span></p>
            <div class="total-amount">
                <span id="amount-display">199</span> ₽
            </div>
        </div>

        <div id="payment-form"></div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message">
            ✅ Оплата прошла успешно! <br> Результат придёт вам на почту в течение 1 часа.
        </div>

        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>

    <!-- Скрипт виджета ЮKassa -->
    <script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>

    <script>
        // ============================================================
        // ВАШИ РЕАЛЬНЫЕ ДАННЫЕ
        // ============================================================
        const SHOP_ID = '1347435';
        const SECRET_KEY = 'live_TxAIxwMW82jYuOI1qAecWClpHfXGluTIjkRW_rNZfS8';
        const RETURN_URL = 'https://www.keyarcana.ru/oplata.html';
        
        // ============================================================
        // Параметры заказа из URL
        // ============================================================
        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }
        
        const serviceName = getQueryParam('service') || 'Расклад Таро';
        const serviceDesc = getQueryParam('desc') || 'Стандартный расклад';
        const amount = parseFloat(getQueryParam('amount')) || 199.00;
        
        document.getElementById('service-name').textContent = serviceName;
        document.getElementById('service-desc').textContent = serviceDesc;
        document.getElementById('amount-display').textContent = amount.toFixed(2);
        
        // ============================================================
        // Создание платежа через API ЮKassa
        // ============================================================
        async function createPayment() {
            const url = 'https://api.yookassa.ru/v3/payments';
            const idempotenceKey = generateUUID();
            
            const paymentData = {
                amount: {
                    value: amount.toFixed(2),
                    currency: 'RUB'
                },
                confirmation: {
                    type: 'embedded'
                },
                capture: true,
                description: `${serviceName} - ${serviceDesc}`,
                metadata: {
                    service: serviceName,
                    order_id: 'order_' + Date.now()
                }
            };
            
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(`${SHOP_ID}:${SECRET_KEY}`),
                        'Idempotence-Key': idempotenceKey
                    },
                    body: JSON.stringify(paymentData)
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Ошибка создания платежа: ${errorData.description || response.statusText}`);
                }
                
                const payment = await response.json();
                console.log('Платёж создан:', payment);
                return payment;
                
            } catch (error) {
                console.error('Ошибка:', error);
                showError('Не удалось создать платёж. Пожалуйста, попробуйте позже или свяжитесь с нами.');
                return null;
            }
        }
        
        function initializeWidget(confirmationToken) {
            try {
                const checkout = new window.YooMoneyCheckoutWidget({
                    confirmation_token: confirmationToken,
                    return_url: RETURN_URL,
                    error_callback: function(error) {
                        console.error('Ошибка виджета:', error);
                        showError('Произошла ошибка при инициализации платёжной формы. Код: ' + error.error);
                    },
                    customization: {
                        colors: {
                            control_primary: '#ffd966',
                            background: '#1a112f',
                            background_secondary: '#0e081c',
                            border: '#54337a',
                            text_primary: '#ede4f5',
                            text_secondary: '#cfc0e8'
                        }
                    }
                });
                
                checkout.render('payment-form')
                    .then(() => {
                        console.log('Виджет успешно отрисован');
                        document.getElementById('error-message').style.display = 'none';
                    })
                    .catch((error) => {
                        console.error('Ошибка рендеринга:', error);
                        showError('Не удалось отобразить форму оплаты. Обновите страницу.');
                    });
                    
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showError('Ошибка загрузки платёжной системы. Попробуйте позже.');
            }
        }
        
        function checkPaymentResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentId = urlParams.get('orderId');
            if (paymentId) {
                document.getElementById('success-message').style.display = 'block';
            }
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => { errorEl.style.display = 'none'; }, 10000);
        }
        
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                const v = c === 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }
        
        async function startPayment() {
            const paymentForm = document.getElementById('payment-form');
            paymentForm.innerHTML = '<p style="color: #ffd966;">⏳ Подготовка безопасного платежа...</p>';
            
            const payment = await createPayment();
            
            if (payment && payment.confirmation && payment.confirmation.confirmation_token) {
                paymentForm.innerHTML = '';
                initializeWidget(payment.confirmation.confirmation_token);
            } else {
                paymentForm.innerHTML = '';
                showError('Не удалось инициировать платёж. Пожалуйста, свяжитесь с нами.');
            }
        }
        
        window.addEventListener('load', () => {
            checkPaymentResult();
            if (!window.location.search.includes('orderId')) {
                startPayment();
            }
        });
    </script>
</body>
</html>
