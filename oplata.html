<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Оплата заказа · KeyArcana</title>
    <meta name="theme-color" content="#06040a">
    <style>
        body {
            background: #06040a;
            font-family: 'Jost', sans-serif;
            color: #ede4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .payment-container {
            background: rgba(24, 14, 40, 0.9);
            border: 1px solid #c9a03e;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 45px rgba(201, 160, 62, 0.2);
            margin: 20px auto;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #ffd966;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .service-info {
            background: rgba(14, 8, 28, 0.8);
            border: 1px solid #54337a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .service-info p { margin: 8px 0; font-size: 1rem; color: #cfc0e8; }
        .service-info strong { color: #ffd966; }
        .total-amount {
            font-size: 2rem; color: #ffd966; font-weight: 700; margin: 15px 0; text-shadow: 0 0 10px #ffd700;
        }
        #payment-form { margin-top: 20px; }
        .error-message { color: #ff6b6b; margin-top: 15px; display: none; padding: 12px; background: rgba(255,0,0,0.1); border-radius: 8px; }
        .success-message { color: #51cf66; margin-top: 15px; display: none; padding: 12px; background: rgba(81,207,102,0.1); border-radius: 8px; }
        .back-link { display: inline-block; margin-top: 20px; color: #dac0ff; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back-link:hover { color: #ffd966; text-shadow: 0 0 8px #ffd966; }
        @media (max-width: 600px) {
            .payment-container { padding: 25px 18px; border-radius: 24px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>🔮 Оплата заказа</h1>
        <div class="service-info">
            <p><strong>Услуга:</strong> <span id="service-name">Расклад Таро</span></p>
            <p><strong>Описание:</strong> <span id="service-desc">Стандартный расклад</span></p>
            <div class="total-amount"><span id="amount-display">199</span> ₽</div>
        </div>
        <div id="payment-form"></div>
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message">✅ Оплата прошла успешно! Заявка отправлена.<br>Результат придёт вам на почту в течение 1 часа.</div>
        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>

    <script src="https://yookassa.ru/checkout-widget/v1/checkout-widget.js"></script>
    <script>
        const SHOP_ID = '1347435';
        const SECRET_KEY = 'live_TxAIxwMW82jYuOI1qAecWClpHfXGluTIjkRW_rNZfS8';
        const RETURN_URL = 'https://www.keyarcana.ru/oplata.html';

        function getQueryParam(param) {
            return new URLSearchParams(window.location.search).get(param);
        }

        const serviceName = getQueryParam('service') || 'Расклад Таро';
        const serviceDesc = getQueryParam('desc') || 'Стандартный расклад';
        const amount = parseFloat(getQueryParam('amount')) || 199.00;
        const userName = getQueryParam('name') || '';
        const userContact = getQueryParam('contact') || '';

        document.getElementById('service-name').textContent = serviceName;
        document.getElementById('service-desc').textContent = serviceDesc;
        document.getElementById('amount-display').textContent = amount.toFixed(2);

        async function sendOrderNotification(orderId) {
            const formData = new FormData();
            formData.append('access_key', '6c84f063-e048-4fab-a15f-b15c9b635966');
            formData.append('name', userName);
            formData.append('email', userContact);
            formData.append('subject', `Новый заказ: ${serviceName}`);
            formData.append('message', `Имя: ${userName}\nКонтакт: ${userContact}\nУслуга: ${serviceName}\nОписание: ${serviceDesc}\nСумма: ${amount.toFixed(2)} ₽\nID платежа: ${orderId}`);
            try {
                await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
                console.log('Уведомление отправлено');
            } catch (e) {
                console.error('Ошибка отправки уведомления', e);
            }
        }

        async function createPayment() {
            const idempotenceKey = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:r&0x3|0x8).toString(16); });
            const paymentData = {
                amount: { value: amount.toFixed(2), currency: 'RUB' },
                payment_method_data: { type: 'bank_card' },
                confirmation: { type: 'embedded' },
                capture: true,
                description: `${serviceName} - ${serviceDesc}`,
                metadata: { service: serviceName, order_id: 'order_' + Date.now() }
            };
            try {
                const response = await fetch('https://api.yookassa.ru/v3/payments', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Basic ' + btoa(`${SHOP_ID}:${SECRET_KEY}`),
                        'Idempotence-Key': idempotenceKey
                    },
                    body: JSON.stringify(paymentData)
                });
                if (!response.ok) throw new Error((await response.json()).description || 'Ошибка');
                return await response.json();
            } catch (error) {
                console.error(error);
                showError('Не удалось создать платёж.');
                return null;
            }
        }

        function initializeWidget(token) {
            try {
                const checkout = new window.YooMoneyCheckoutWidget({
                    confirmation_token: token,
                    return_url: RETURN_URL,
                    error_callback: error => showError('Ошибка формы оплаты: ' + error.error),
                    customization: {
                        colors: {
                            control_primary: '#ffd966',
                            background: '#1a112f',
                            background_secondary: '#0e081c',
                            border: '#54337a',
                            text_primary: '#ede4f5',
                            text_secondary: '#cfc0e8'
                        }
                    }
                });
                checkout.render('payment-form').catch(e => showError('Не удалось загрузить форму оплаты.'));
            } catch (e) {
                showError('Ошибка загрузки платёжной системы.');
            }
        }

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 10000);
        }

        async function startPayment() {
            document.getElementById('payment-form').innerHTML = '<p style="color:#ffd966;">⏳ Подготовка платежа...</p>';
            const payment = await createPayment();
            if (payment?.confirmation?.confirmation_token) {
                document.getElementById('payment-form').innerHTML = '';
                initializeWidget(payment.confirmation.confirmation_token);
            } else {
                document.getElementById('payment-form').innerHTML = '';
                showError('Не удалось инициировать платёж.');
            }
        }

        window.addEventListener('load', () => {
            const orderId = getQueryParam('orderId');
            if (orderId) {
                document.getElementById('success-message').style.display = 'block';
                sendOrderNotification(orderId);
            } else {
                startPayment();
            }
        });
    </script>
</body>
</html>
