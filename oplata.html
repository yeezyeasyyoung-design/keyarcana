<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Оплата заказа · KeyArcana</title>
    <meta name="theme-color" content="#06040a">
    <style>
        /* Твои стили */
        body {
            background: #06040a;
            font-family: 'Jost', sans-serif;
            color: #ede4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .payment-container {
            background: rgba(24, 14, 40, 0.9);
            border: 1px solid #c9a03e;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 45px rgba(201, 160, 62, 0.2);
            margin: 20px auto;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #ffd966;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .success-message {
            color: #51cf66; margin-top: 15px; display: none; padding: 12px;
            background: rgba(81,207,102,0.1); border-radius: 8px;
        }
        .back-link { display: inline-block; margin-top: 20px; color: #dac0ff; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back-link:hover { color: #ffd966; text-shadow: 0 0 8px #ffd966; }
        /* Остальные стили формы оставь как есть — они встроены в код ЮKassa */
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>🔮 Оплата заказа</h1>
        
        <!-- ВСТАВЛЯЕМ ТВОЙ КОД ФОРМЫ -->
        <form id="yookassa-form" action="https://yoomoney.ru/quickpay/confirm.xml" method="POST">
            <!-- Товары будут динамически заменены -->
            <div id="ym-products"></div>
            <input value="" type="hidden" name="ym_merchant_receipt">

            <div class="ym-customer-info">
                <div class="ym-block-title">О покупателе</div>
                <input class="ym-input" name="email" id="customer-email" placeholder="Телефон или Email для чека" type="text">
            </div>

            <div class="ym-payment-btn-block ym-before-line ym-align-space-between">
                <div class="ym-input-icon-rub ym-display-none">
                    <input name="sum" id="form-sum" placeholder="0.00" class="ym-input ym-sum-input ym-required-input" type="number" step="any" value="199">
                </div>
                <button data-text="Заплатить" class="ym-btn-pay ym-result-price">
                    <span class="ym-text-crop">Заплатить</span> 
                    <span class="ym-price-output" id="price-output">199,00 ₽</span>
                </button>
                <img src="https://yookassa.ru/integration/simplepay/img/iokassa-gray.svg?v=1.34.0" class="ym-logo" width="114" height="27" alt="ЮKassa">
            </div>
            <input name="shopId" type="hidden" value="1347435">
        </form>
        <!-- КОНЕЦ КОДА ЮKassa -->

        <!-- Сообщение об успехе (после возврата) -->
        <div id="success-message" class="success-message">
            ✅ Оплата прошла успешно! Заявка отправлена.<br>Результат придёт вам на почту в течение 1 часа.
        </div>

        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>

    <!-- Скрипт ЮKassa (обязательно) -->
    <script src="https://yookassa.ru/integration/simplepay/js/yookassa_construct_form.js?v=1.34.0"></script>

    <script>
        // ============================================================
        // Читаем параметры из URL, переданные из index.html
        // ============================================================
        function getQueryParam(param) {
            return new URLSearchParams(window.location.search).get(param);
        }

        const serviceName = getQueryParam('service') || 'Расклад Таро';
        const serviceDesc = getQueryParam('desc') || 'Стандартный расклад';
        const amount = parseFloat(getQueryParam('amount')) || 199.00;
        const userName = getQueryParam('name') || '';
        const userContact = getQueryParam('contact') || '';

        // ============================================================
        // Динамически формируем товар в форме
        // ============================================================
        function updateForm() {
            // Устанавливаем сумму
            document.getElementById('form-sum').value = amount.toFixed(2);
            document.getElementById('price-output').textContent = amount.toFixed(2).replace('.', ',') + ' ₽';

            // Заполняем email покупателя, если передан
            if (userContact) {
                document.getElementById('customer-email').value = userContact;
            }

            // Генерируем блок с одним товаром
            const productsDiv = document.getElementById('ym-products');
            productsDiv.innerHTML = `
                <div class="ym-product">
                    <div class="ym-product-line">
                        <span class="ym-product-description">${serviceName} - ${serviceDesc}</span>
                        <span class="ym-product-price" data-price="${amount.toFixed(2)}" data-id="custom" data-count="1">${amount.toFixed(2).replace('.', ',')} ₽</span>
                    </div>
                    <div class="ym-product-line ym-align-items-center">
                        <span class="ym-label-text">Количество</span>
                        <div class="ym-count-input">
                            <input class="ym-input" value="1.00" type="number" step="any" disabled>
                            <span class="ym-count-control ym-count-plus"></span>
                            <span class="ym-count-control ym-count-minus"></span>
                        </div>
                    </div>
                    <input disabled type="hidden" name="text" value="${serviceName} - ${serviceDesc}">
                    <input disabled type="hidden" name="price" value="${amount.toFixed(2)}">
                    <input disabled type="hidden" name="quantity" value="1">
                    <input disabled type="hidden" name="paymentSubjectType" value="service">
                    <input disabled type="hidden" name="paymentMethodType" value="full_prepayment">
                    <input disabled type="hidden" name="tax" value="1">
                </div>
            `;
        }

        updateForm();

        // ============================================================
        // Отправка уведомления после успешной оплаты
        // ============================================================
        async function sendOrderNotification(orderId) {
            if (!userContact) return;
            const formData = new FormData();
            formData.append('access_key', '6c84f063-e048-4fab-a15f-b15c9b635966');
            formData.append('name', userName);
            formData.append('email', userContact);
            formData.append('subject', `Новый заказ: ${serviceName}`);
            formData.append('message', `Имя: ${userName}\nКонтакт: ${userContact}\nУслуга: ${serviceName}\nОписание: ${serviceDesc}\nСумма: ${amount.toFixed(2)} ₽\nID платежа: ${orderId}`);
            try {
                await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
                console.log('Уведомление отправлено');
            } catch (e) { /* не критично */ }
        }

        // ============================================================
        // Проверка возврата после оплаты
        // ============================================================
        window.addEventListener('load', () => {
            const orderId = getQueryParam('orderId') || getQueryParam('paymentId');
            if (orderId) {
                // Скрываем форму, показываем успех
                document.getElementById('yookassa-form').style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
                sendOrderNotification(orderId);
            }
        });
    </script>
</body>
</html>
