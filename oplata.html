<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Оплата заказа · KeyArcana</title>
    <meta name="theme-color" content="#06040a">
    <style>
        body {
            background: #06040a;
            font-family: 'Jost', sans-serif;
            color: #ede4f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .payment-container {
            background: rgba(24, 14, 40, 0.9);
            border: 1px solid #c9a03e;
            border-radius: 32px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 45px rgba(201, 160, 62, 0.2);
            margin: 20px auto;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            color: #ffd966;
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .service-info {
            background: rgba(14, 8, 28, 0.8);
            border: 1px solid #54337a;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }
        .service-info p { margin: 8px 0; font-size: 1rem; color: #cfc0e8; }
        .service-info strong { color: #ffd966; }
        .total-amount {
            font-size: 2rem; color: #ffd966; font-weight: 700; margin: 15px 0; text-shadow: 0 0 10px #ffd700;
        }
        .redirect-message {
            color: #ffd966; font-size: 1.1rem; margin: 20px 0;
        }
        .error-message {
            color: #ff6b6b; margin-top: 15px; padding: 15px;
            background: rgba(255,0,0,0.1); border-radius: 8px;
            display: none; white-space: pre-wrap; text-align: left; font-size: 0.9rem;
        }
        .success-message { color: #51cf66; margin-top: 15px; display: none; padding: 12px; background: rgba(81,207,102,0.1); border-radius: 8px; }
        .back-link { display: inline-block; margin-top: 20px; color: #dac0ff; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back-link:hover { color: #ffd966; text-shadow: 0 0 8px #ffd966; }
        @media (max-width: 600px) {
            .payment-container { padding: 25px 18px; border-radius: 24px; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="payment-container">
        <h1>🔮 Оплата заказа</h1>
        <div class="service-info">
            <p><strong>Услуга:</strong> <span id="service-name">Расклад Таро</span></p>
            <p><strong>Описание:</strong> <span id="service-desc">Стандартный расклад</span></p>
            <div class="total-amount"><span id="amount-display">199</span> ₽</div>
        </div>

        <!-- Сообщение о перенаправлении -->
        <div id="redirect-block">
            <p class="redirect-message">⏳ Переходим на безопасную страницу оплаты…</p>
            <p style="color:#cfc0e8; font-size:0.9rem;">Если переход не произошёл автоматически, нажмите кнопку:</p>
            <button id="manual-pay-btn" class="gold-btn" style="margin-top:10px;">Перейти к оплате</button>
        </div>

        <!-- Сообщение об успехе (после возврата) -->
        <div id="success-message" class="success-message" style="display:none;">
            ✅ Оплата прошла успешно! Заявка отправлена.<br>Результат придёт вам на почту в течение 1 часа.
        </div>

        <div id="error-message" class="error-message"></div>
        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>

    <script>
        // ID вашего магазина в ЮKassa (тот же, что и раньше)
        const SHOP_ID = '1347435';
        // URL, куда вернётся покупатель после оплаты (этот же файл)
        const RETURN_URL = 'https://keyarcana.ru/oplata.html';

        // Считываем параметры из URL
        function getQueryParam(param) {
            return new URLSearchParams(window.location.search).get(param);
        }

        const serviceName = getQueryParam('service') || 'Расклад Таро';
        const serviceDesc = getQueryParam('desc') || 'Стандартный расклад';
        const amount = parseFloat(getQueryParam('amount')) || 199.00;
        const userName = getQueryParam('name') || '';
        const userContact = getQueryParam('contact') || '';

        // Отображаем информацию о заказе
        document.getElementById('service-name').textContent = serviceName;
        document.getElementById('service-desc').textContent = serviceDesc;
        document.getElementById('amount-display').textContent = amount.toFixed(2);

        // Функция отправки уведомления о заказе (после возврата)
        async function sendOrderNotification(orderId) {
            if (!userContact) return;
            const formData = new FormData();
            formData.append('access_key', '6c84f063-e048-4fab-a15f-b15c9b635966');
            formData.append('name', userName);
            formData.append('email', userContact);
            formData.append('subject', `Новый заказ: ${serviceName}`);
            formData.append('message', `Имя: ${userName}\nКонтакт: ${userContact}\nУслуга: ${serviceName}\nОписание: ${serviceDesc}\nСумма: ${amount.toFixed(2)} ₽\nID платежа: ${orderId}`);
            try {
                await fetch('https://api.web3forms.com/submit', { method: 'POST', body: formData });
                console.log('Уведомление отправлено');
            } catch (e) {
                // не критично
            }
        }

        // Проверяем, вернулся ли пользователь после оплаты
        window.addEventListener('load', () => {
            const orderId = getQueryParam('orderId');
            if (orderId) {
                // Показываем сообщение об успехе и отправляем заявку
                document.getElementById('redirect-block').style.display = 'none';
                document.getElementById('success-message').style.display = 'block';
                sendOrderNotification(orderId);
            } else {
                // Формируем данные для платёжной формы ЮKassa
                const paymentData = {
                    shopId: SHOP_ID,
                    sum: amount,
                    customerNumber: userContact || 'anonymous',
                    paymentType: 'AC',   // банковская карта (или 'PC' для ЮMoney, 'GP' для Google Pay и т.д.)
                    description: `${serviceName} - ${serviceDesc}`,
                    orderNumber: 'order_' + Date.now(),
                    returnUrl: RETURN_URL,
                    // Дополнительные параметры можно добавить, если нужно
                };

                // Строим URL для платёжной формы
                const queryString = Object.keys(paymentData)
                    .map(key => encodeURIComponent(key) + '=' + encodeURIComponent(paymentData[key]))
                    .join('&');
                const paymentURL = 'https://yookassa.ru/checkout/pay/v1?' + queryString;

                // Автоматический переход через 1 секунду
                setTimeout(() => {
                    window.location.href = paymentURL;
                }, 1000);

                // На случай, если авторедирект не сработал, вешаем на кнопку
                document.getElementById('manual-pay-btn').addEventListener('click', () => {
                    window.location.href = paymentURL;
                });
            }
        });
    </script>
</body>
</html>
